<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sign Up | Creative Showcase</title>
  <link rel="stylesheet" href="css/style.css" />
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <h1>Creative Showcase</h1>
      <nav class="nav-actions">
        <a href="login.html" class="nav-button">Log in</a>
      </nav>
    </div>
  </header>

  <!-- Signup Section -->
  <main class="auth-container">
    <div class="auth-card">
      <h2>Create your account</h2>
      <p class="auth-subtitle">Join and showcase your creativity</p>

      <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email address" required />
        <input type="password" id="password" placeholder="Password" required />

        <button type="submit" class="primary-btn">Sign up</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </div>
  </main>
  <!-- Footer -->
<footer class="site-footer">
  <div class="footer-container">

    <div class="footer-left">
      <h3>Creative Showcase</h3>
      <p>
        A platform for artists to upload, share, and showcase their creative work.
      </p>

      <div class="footer-social">
        <a href="https://github.com/GitSubham-00" target="_blank" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://linkedin.com/in/subhammaity" target="_blank" aria-label="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
      </div>
    </div>

    <div class="footer-right">
      <a href="index.html">Home</a>
      <a href="signup.html">Sign Up</a>
      <a href="login.html">Login</a>
    </div>

  </div>

  <div class="footer-bottom">
    © 2025 Creative Showcase. Built by Subham Maity.
  </div>
</footer>


  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
